AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AvionPulse — the serverless member of the AvionDash suite. Three-tier AWS app
  (CloudFront+S3 / API Gateway+Lambda / DynamoDB+SQS) built to generate
  serverless telemetry and chaos faults for Datadog. Sized for the AWS free tier.

Parameters:
  AppEnv:
    Type: String
    Default: demo
    Description: Value for the env tag (Datadog DD_ENV).
  AppVersion:
    Type: String
    Default: 1.0.0
  EnableDatadog:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Attach the Datadog Python library + Extension layers to the Lambdas.
  DatadogSite:
    Type: String
    Default: datadoghq.com
  DatadogApiKeySsmName:
    Type: String
    Default: /avionpulse/datadog/api-key
    Description: SSM SecureString holding the Datadog API key (created by scripts/deploy).
  DatadogPythonLayerVersion:
    Type: Number
    Default: 107
    Description: Version of arn:aws:lambda:<region>:464622532012:layer:Datadog-Python312-ARM — check Datadog docs for the latest.
  DatadogExtensionLayerVersion:
    Type: Number
    Default: 80
    Description: Version of arn:aws:lambda:<region>:464622532012:layer:Datadog-Extension-ARM — check Datadog docs for the latest.
  SimulatorSchedule:
    Type: String
    Default: rate(5 minutes)
  ApiRateLimit:
    Type: Number
    Default: 20
    Description: Steady-state req/s ceiling on the HTTP API (cost guard; restored after the api_throttling fault).
  ApiBurstLimit:
    Type: Number
    Default: 40
  FaultTtlMinutes:
    Type: Number
    Default: 30
    Description: Default minutes before an injected fault auto-reverts.
  LogRetentionDays:
    Type: Number
    Default: 3
    AllowedValues: [1, 3, 5, 7, 14]
  BudgetEmail:
    Type: String
    Default: ''
    Description: Optional. If set, creates a monthly AWS Budget alerting this address.
  MonthlyBudgetUsd:
    Type: Number
    Default: 5
  SeedVersion:
    Type: String
    Default: '1'
    Description: Change this value to reseed the table on the next deploy.
  AdminPassword:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional. Replaces the published demo password for the admin user (chaos access).

Conditions:
  UseDatadog: !Equals [!Ref EnableDatadog, 'true']
  CreateBudget: !Not [!Equals [!Ref BudgetEmail, '']]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]   # Graviton: ~20% cheaper per GB-second than x86
    MemorySize: 256
    Timeout: 10
    CodeUri: src/
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        QUEUE_URL: !Ref EventsQueue
        DLQ_URL: !Ref EventsDLQ
        BUCKET: !Ref SiteBucket
        API_FN: !Sub ${AWS::StackName}-api
        WORKER_FN: !Sub ${AWS::StackName}-worker
        SIM_FN: !Sub ${AWS::StackName}-simulator
        APP_ENV: !Ref AppEnv
        APP_VERSION: !Ref AppVersion
        DEFAULT_RATE: !Ref ApiRateLimit
        DEFAULT_BURST: !Ref ApiBurstLimit
        FAULT_TTL_MIN: !Ref FaultTtlMinutes
        # Datadog settings are inert unless the layers are attached.
        DD_SITE: !Ref DatadogSite
        DD_API_KEY_SSM_NAME: !Ref DatadogApiKeySsmName
        DD_ENV: !Ref AppEnv
        DD_SERVICE: avionpulse
        DD_VERSION: !Ref AppVersion
        DD_TRACE_ENABLED: 'true'
        DD_SERVERLESS_LOGS_ENABLED: 'true'
        DD_LOGS_INJECTION: 'true'
        DD_ENHANCED_METRICS: 'true'
        DD_COLD_START_TRACING: 'true'
        DD_CAPTURE_LAMBDA_PAYLOAD: 'false'
        DD_MERGE_XRAY_TRACES: 'false'
        DD_TAGS: !Sub 'app:avionpulse,suite:aviondash,stack:${AWS::StackName}'

Resources:
  # ════════════════════════════ DATA TIER ════════════════════════════════
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      TableName: !Sub ${AWS::StackName}-data
      BillingMode: PROVISIONED          # 5/5 sits inside the 25 RCU / 25 WCU always-free allowance
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - {Key: app, Value: avionpulse}

  EventsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-events-dlq
      MessageRetentionPeriod: 345600     # 4 days
      SqsManagedSseEnabled: true
      Tags:
        - {Key: app, Value: avionpulse}

  EventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-events
      VisibilityTimeout: 60              # 6x the worker timeout
      MessageRetentionPeriod: 86400
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EventsDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - {Key: app, Value: avionpulse}

  # ════════════════════════════ WEB TIER ═════════════════════════════════
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      Tags:
        - {Key: app, Value: avionpulse}

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub AvionPulse (${AWS::StackName})
        DefaultRootObject: index.html
        PriceClass: PriceClass_100       # NA + EU edges only — cheapest class
        HttpVersion: http2and3
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 30
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
      Tags:
        - {Key: app, Value: avionpulse}

  # ════════════════════════════ APP TIER ═════════════════════════════════
  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}-access
      RetentionInDays: !Ref LogRetentionDays

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: AvionPulse API (reached via CloudFront /api/*)
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ApiRateLimit
        ThrottlingBurstLimit: !Ref ApiBurstLimit
      # Chaos + auth routes keep their own limits, so the api_throttling fault
      # (which only rewrites DefaultRouteSettings) can always be switched off.
      RouteSettings:
        "ANY /api/chaos/{proxy+}":
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
        "ANY /api/auth/{proxy+}":
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.path","status":"$context.status","latency_ms":"$context.responseLatency","integration_latency_ms":"$context.integrationLatency","integration_error":"$context.integrationErrorMessage","error":"$context.error.message"}'
      Tags:
        app: avionpulse

  # Permissions shared by the API and simulator: everything the chaos engine
  # needs to break and repair real resources, scoped to this stack's names.
  ChaosInfraPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: AvionPulse runtime + chaos control-plane permissions
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: StageThrottle
            Effect: Allow
            Action: [apigateway:GET, apigateway:PATCH]
            Resource:
              - !Sub arn:aws:apigateway:${AWS::Region}::/apis/*/stages/*
          - Sid: RecycleApiFunction
            Effect: Allow
            Action: [lambda:GetFunctionConfiguration, lambda:UpdateFunctionConfiguration]
            Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-api
          - Sid: WorkerConcurrency
            Effect: Allow
            Action: [lambda:PutFunctionConcurrency, lambda:DeleteFunctionConcurrency, lambda:GetFunctionConcurrency]
            Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-worker
          - Sid: ListMappings
            Effect: Allow
            Action: lambda:ListEventSourceMappings
            Resource: '*'
          - Sid: ToggleMappings
            Effect: Allow
            Action: [lambda:UpdateEventSourceMapping, lambda:GetEventSourceMapping]
            Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:event-source-mapping:*
          - Sid: Queues
            Effect: Allow
            Action: [sqs:SendMessage, sqs:GetQueueAttributes]
            Resource: [!GetAtt EventsQueue.Arn, !GetAtt EventsDLQ.Arn]
          - Sid: NotamObjects
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/data/*
          - Sid: ListBucketSoMissingKeysAre404
            Effect: Allow
            Action: s3:ListBucket
            Resource: !GetAtt SiteBucket.Arn
          - Sid: DatadogApiKey
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatadogApiKeySsmName}
          - Sid: DecryptSsmDefaultKey
            Effect: Allow
            Action: kms:Decrypt
            Resource: '*'
            Condition:
              StringEquals:
                kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
          # Intentionally NO permission on <stack>-data-restricted-ledger:
          # the iam_access_denied fault depends on that gap.

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-api
      RetentionInDays: !Ref LogRetentionDays

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-api
      Description: AvionPulse REST API + chaos engine
      Handler: !If [UseDatadog, datadog_lambda.handler.handler, api.handler]
      Layers: !If
        - UseDatadog
        - - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Python312-ARM:${DatadogPythonLayerVersion}
          - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Extension-ARM:${DatadogExtensionLayerVersion}
        - !Ref AWS::NoValue
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          DD_LAMBDA_HANDLER: api.handler
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
        - !Ref ChaosInfraPolicy
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/{proxy+}
            Method: ANY
        ChaosApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/chaos/{proxy+}
            Method: ANY
        AuthApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/auth/{proxy+}
            Method: ANY
      Tags:
        app: avionpulse

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-worker
      RetentionInDays: !Ref LogRetentionDays

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-worker
      Description: AvionPulse SQS consumer (ops + maintenance events)
      Handler: !If [UseDatadog, datadog_lambda.handler.handler, worker.handler]
      Layers: !If
        - UseDatadog
        - - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Python312-ARM:${DatadogPythonLayerVersion}
          - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Extension-ARM:${DatadogExtensionLayerVersion}
        - !Ref AWS::NoValue
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref WorkerLogGroup
      Environment:
        Variables:
          DD_LAMBDA_HANDLER: worker.handler
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
        - !Ref ChaosInfraPolicy
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt EventsQueue.Arn
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 5
            FunctionResponseTypes: [ReportBatchItemFailures]
      Tags:
        app: avionpulse

  SimulatorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-simulator
      RetentionInDays: !Ref LogRetentionDays

  SimulatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-simulator
      Description: AvionPulse flight simulator, business metrics and chaos janitor
      Handler: !If [UseDatadog, datadog_lambda.handler.handler, simulator.handler]
      Timeout: 30
      Layers: !If
        - UseDatadog
        - - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Python312-ARM:${DatadogPythonLayerVersion}
          - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Extension-ARM:${DatadogExtensionLayerVersion}
        - !Ref AWS::NoValue
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref SimulatorLogGroup
      Environment:
        Variables:
          DD_LAMBDA_HANDLER: simulator.handler
      EventInvokeConfig:
        MaximumRetryAttempts: 1
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
        - !Ref ChaosInfraPolicy
      Events:
        Tick:
          Type: Schedule
          Properties:
            Schedule: !Ref SimulatorSchedule
            Description: AvionPulse simulator tick
      Tags:
        app: avionpulse

  SeedLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-seed
      RetentionInDays: !Ref LogRetentionDays

  SeedFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-seed
      Description: AvionPulse table seeder (CloudFormation custom resource)
      Handler: seed.handler
      Timeout: 120
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref SeedLogGroup
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
        - !Ref ChaosInfraPolicy

  SeedData:
    Type: Custom::AvionPulseSeed
    DependsOn: [EventsQueue]
    Properties:
      ServiceToken: !GetAtt SeedFunction.Arn
      SeedVersion: !Ref SeedVersion
      AdminPassword: !Ref AdminPassword

  # ════════════════════════════ COST GUARD ═══════════════════════════════
  CostBudget:
    Type: AWS::Budgets::Budget
    Condition: CreateBudget
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyBudgetUsd, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]

Outputs:
  SiteUrl:
    Description: Open this in a browser
    Value: !Sub https://${Distribution.DomainName}
  DistributionId:
    Value: !Ref Distribution
  BucketName:
    Value: !Ref SiteBucket
  ApiEndpoint:
    Description: Direct API Gateway URL (bypasses CloudFront)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  ApiId:
    Value: !Ref HttpApi
  TableName:
    Value: !Ref Table
  QueueUrl:
    Value: !Ref EventsQueue
  DeadLetterQueueUrl:
    Value: !Ref EventsDLQ
  ApiFunctionName:
    Value: !Ref ApiFunction
